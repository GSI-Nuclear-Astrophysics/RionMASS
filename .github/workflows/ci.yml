name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI reads the checkout; publishing permissions are separate.
permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0

      - name: Install package (all extras)
        run: python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pyright

  build:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_release.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  fresh-install-smoke-test:
    name: fresh-venv wheel install smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel (all extras) into a fresh environment
        run: python -m pip install "$(ls dist/*.whl)[data,plot,gui]"
      - name: Import + entry-point smoke test, from outside any checkout
        run: |
          cd /tmp
          python -c "import rionmass; print(rionmass.__version__)"
          rionmass --version
